<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vicinae</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .card {
      width: 360px;
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      color: #6b7280;
      margin: 0;
    }

    .description.success {
      color: #16a34a;
    }

    .description.error {
      color: #ef4444;
    }

    #allowBtn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: #22c55e;
    }

    #allowBtn:hover {
      background: #16a34a;
    }

    #allowBtn[hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #f9fafb;
      }

      .card {
        background: #1f2937;
        box-shadow: none;
      }

      .description {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon128.png" class="logo" alt="Vicinae">
    <h1 id="title" class="title"></h1>
    <p id="description" class="description"></p>
    <button id="allowBtn" hidden>Allow</button>
  </div>

  <script src="permissions.js"></script>
</body>
</html>
