# Solarized Osaka - Deep Teal Night
# A darker, higher-contrast take on Solarized with deep teal tones

[meta]
version = 1
name = "Solarized Osaka"
description = "A darker, higher-contrast take on Solarized with deep teal tones"
variant = "dark"
icon = "icons/solarized.png"

[colors.core]
background = "#001419"
foreground = "#839395"
secondary_background = "#002028"
border = "#004C5F"
accent = "#268BD3"

[colors.accents]
blue = "#268BD3"
cyan = "#29A298"
green = "#849900"
magenta = "#D23681"
orange = "#C94C16"
purple = "#6D71C4"
red = "#DB302D"
yellow = "#B28500"

[colors.syntax]
keyword = "colors.accents.green"
control_flow = "colors.accents.green"
function = "colors.accents.blue"
type = "colors.accents.yellow"
string = "colors.accents.cyan"
number = "colors.accents.cyan"
constant = "colors.accents.cyan"
attribute = "colors.accents.blue"
preprocessor = "colors.accents.orange"
special = "colors.accents.red"
heading = "colors.accents.blue"
emphasis = "colors.accents.magenta"
inline_code = "colors.accents.cyan"

[colors.list.item.selection]
background = { name = "colors.core.accent", opacity = 0.36 }
secondary_background = { name = "colors.core.accent", opacity = 0.45 }

[colors.grid.item]
background = "#00495b"
