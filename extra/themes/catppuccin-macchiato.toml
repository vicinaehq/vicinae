# Catppuccin Macchiato - Medium Contrast
# Medium contrast with gentle colors creating a soothing atmosphere

[meta]
version = 1
name = "Catppuccin Macchiato"
description = "Medium contrast with gentle colors creating a soothing atmosphere."
variant = "dark"
icon = "icons/catppuccin.png"

[colors.core]
background = "#24273A"        # Base
foreground = "#CAD3F5"        # Text
secondary_background = "#1E2030"  # Mantle
border = "#464C71"            # Surface0
accent = "#8AADF4"            # Blue

[colors.accents]
blue = "#8AADF4"
green = "#A6DA95"
magenta = "#F5BDE6"
orange = "#F5A97F"
purple = "#C6A0F6"
red = "#ED8796"
yellow = "#EED49F"
cyan = "#8BD5CA"

[colors.syntax]
keyword = "colors.accents.purple"
control_flow = "colors.accents.purple"
function = "colors.accents.blue"
type = "colors.accents.yellow"
constant = "colors.accents.orange"
attribute = "colors.accents.cyan"
preprocessor = "colors.accents.magenta"
special = "colors.accents.magenta"
heading = "colors.accents.blue"
emphasis = "colors.accents.magenta"

[colors.list.item.selection]
background = "#464a6a"
secondary_background = "#494D64"


[colors.grid.item]
background = "#3d4363"
