# Solarized Light - Low Contrast Light
# Light variant of the popular Solarized theme

[meta]
version = 1
name = "Solarized Light"
description = "Light variant of the popular Solarized theme"
variant = "light"
inherits = "vicinae-light"
icon = "icons/solarized.png"

[colors.core]
accent = "#268BD2"
background = "#FDF6E3"
border = "#827E74"
foreground = "#657B83"
secondary_background = "#EEE8D5"

[colors.accents]
blue = "#268BD2"
cyan = "#2AA198"
green = "#859900"
magenta = "#D33682"
orange = "#CB4B16"
purple = "#6C71C4"
red = "#DC322F"
yellow = "#B58900"


[colors.list.item.hover]
background = { name = "colors.core.border", opacity = 0.39 }

[colors.syntax]
keyword = "colors.accents.green"
control_flow = "colors.accents.green"
function = "colors.accents.blue"
type = "colors.accents.yellow"
string = "colors.accents.cyan"
number = "colors.accents.cyan"
constant = "colors.accents.cyan"
attribute = "colors.accents.blue"
preprocessor = "colors.accents.orange"
special = "colors.accents.red"
heading = "colors.accents.blue"
emphasis = "colors.accents.magenta"
inline_code = "colors.accents.cyan"

[colors.list.item.selection]
background = { name = "colors.core.border", opacity = 0.52 }

[colors.grid.item]
background = { name = "colors.core.border", opacity = 0.22 }
