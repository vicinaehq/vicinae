# Nord - Arctic Dark
# Arctic, north-bluish clean and elegant theme

[meta]
version = 1
name = "Nord"
description = "Arctic, north-bluish clean and elegant theme"
variant = "dark"
icon = "icons/nord.svg"

[colors.core]
background = "#2E3440"        # nord0 (Polar Night)
foreground = "#D8DEE9"        # nord4 (Snow Storm)
secondary_background = "#3B4252"  # nord1 (lighter surface)
border = "#525C72"            # nord3 (subtle border)
accent = "#81A1C1"            # nord9 (blue)

[colors.accents]
blue = "#81A1C1"              # nord9
green = "#A3BE8C"             # nord14
magenta = "#B48EAD"           # nord15
orange = "#D08770"            # nord12
purple = "#B48EAD"            # nord15
red = "#BF616A"               # nord11
yellow = "#EBCB8B"            # nord13
cyan = "#88C0D0"              # nord8

[colors.syntax]
keyword = "colors.accents.blue"
control_flow = "colors.accents.blue"
function = "colors.accents.cyan"
type = "colors.accents.blue"
number = "colors.accents.purple"
constant = "colors.accents.purple"
attribute = "colors.accents.cyan"
preprocessor = "colors.accents.blue"
heading = "colors.accents.cyan"
emphasis = "colors.accents.purple"
inline_code = "colors.accents.yellow"

[colors.list.item.selection]
background = "#505a6f"
secondary_background = "#4C566A"


[colors.grid.item]
background = "#4a5367"
