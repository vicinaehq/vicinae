# Solarized Dark - Low Contrast
# Low-contrast theme designed to reduce eye strain

[meta]
version = 1
name = "Solarized Dark"
description = "Low-contrast theme designed to reduce eye strain"
variant = "dark"
inherits = "vicinae-dark"
icon = "icons/solarized.png"

[colors.core]
accent = "#268BD2"
background = "#002B36"
border = "#586E75"
foreground = "#839496"
secondary_background = "#073642"

[colors.accents]
blue = "#268BD2"
cyan = "#2AA198"
green = "#859900"
magenta = "#D33682"
orange = "#CB4B16"
purple = "#6C71C4"
red = "#DC322F"
yellow = "#B58900"

[colors.list.item.hover]
background = { name = "colors.core.border", opacity = 0.35 }

[colors.syntax]
keyword = "colors.accents.green"
control_flow = "colors.accents.green"
function = "colors.accents.blue"
type = "colors.accents.yellow"
string = "colors.accents.cyan"
number = "colors.accents.cyan"
constant = "colors.accents.cyan"
attribute = "colors.accents.blue"
preprocessor = "colors.accents.orange"
special = "colors.accents.red"
heading = "colors.accents.blue"
emphasis = "colors.accents.magenta"
inline_code = "colors.accents.cyan"

[colors.list.item.selection]
background = { name = "colors.core.border", opacity = 0.54 }

[colors.grid.item]
background = { name = "colors.core.border", opacity = 0.44 }
