# Rosé Pine - Natural Pine
# All natural pine, faux fur and a bit of soho vibes for the classy minimalist

[meta]
version = 1
name = "Rosé Pine"
description = "All natural pine, faux fur and a bit of soho vibes for the classy minimalist"
variant = "dark"
icon = "icons/rose-pine.png"

[colors.core]
background = "#191724"        # base
foreground = "#E0DEF4"        # text
secondary_background = "#1F1D2E"  # surface
border = "#3E3A5A"            # overlay (subtle border)
accent = "#31748F"            # pine

[colors.accents]
blue = "#31748F"              # pine
green = "#9CCFD8"             # foam
magenta = "#C4A7E7"           # iris
orange = "#EBBCBA"            # rose
purple = "#C4A7E7"            # iris
red = "#EB6F92"               # love
yellow = "#F6C177"            # gold
cyan = "#9CCFD8"              # foam

[colors.syntax]
keyword = "colors.accents.blue"
control_flow = "colors.accents.blue"
function = "colors.accents.orange"
type = "colors.accents.yellow"
string = "colors.accents.yellow"
number = "colors.accents.orange"
constant = "colors.accents.orange"
attribute = "colors.accents.purple"
preprocessor = "colors.accents.red"
special = "colors.accents.cyan"
heading = "colors.accents.orange"
emphasis = "colors.accents.purple"
link = "colors.accents.cyan"
link_target = "colors.accents.purple"
inline_code = "colors.accents.yellow"

[colors.list.item.selection]
background = "#3b3a53"
secondary_background = "#403D52"


[colors.grid.item]
background = "#35314c"
